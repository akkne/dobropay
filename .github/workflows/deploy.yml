name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet build Dobropay.slnx -warnaserror
      - run: dotnet test Dobropay.slnx --no-build
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy main
        run: |
          ssh -o BatchMode=yes root@179.252.219.231 "set -eu; cd /opt/dobropay; git fetch origin $GITHUB_SHA; git checkout -f main; git reset --hard $GITHUB_SHA; COMPOSE_PROFILES=sandbox COMPOSE_PARALLEL_LIMIT=1 docker compose up --build -d --remove-orphans; docker compose ps"
