services:
  auth-db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "127.0.0.1:${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 3s
      retries: 30

  merchant-dev-db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ${MERCHANT_DEV_DB_USER}
      POSTGRES_PASSWORD: ${MERCHANT_DEV_DB_PASSWORD}
      POSTGRES_DB: ${MERCHANT_DEV_DB_NAME}
    ports:
      - "127.0.0.1:${MERCHANT_DEV_DB_PORT:-5434}:5432"
    volumes:
      - merchant_dev_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MERCHANT_DEV_DB_USER} -d ${MERCHANT_DEV_DB_NAME}"]
      interval: 3s
      retries: 30

  payments-db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ${PAYMENTS_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD}
      POSTGRES_DB: ${PAYMENTS_DB_NAME}
    ports:
      - "127.0.0.1:${PAYMENTS_DB_PORT:-5435}:5432"
    volumes:
      - payments_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENTS_DB_USER} -d ${PAYMENTS_DB_NAME}"]
      interval: 3s
      retries: 30

  notifications-db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ${NOTIFICATIONS_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATIONS_DB_NAME}
    ports:
      - "127.0.0.1:${NOTIFICATIONS_DB_PORT:-5436}:5432"
    volumes:
      - notifications_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATIONS_DB_USER} -d ${NOTIFICATIONS_DB_NAME}"]
      interval: 3s
      retries: 30

  receipts-db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ${RECEIPTS_DB_USER}
      POSTGRES_PASSWORD: ${RECEIPTS_DB_PASSWORD}
      POSTGRES_DB: ${RECEIPTS_DB_NAME}
    ports:
      - "127.0.0.1:${RECEIPTS_DB_PORT:-5437}:5432"
    volumes:
      - receipts_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RECEIPTS_DB_USER} -d ${RECEIPTS_DB_NAME}"]
      interval: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      retries: 40

  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command: |
      for topic in dobropay.provider-events.v1 dobropay.payment-events.v1 dobropay.dlq.payments-provider-events.v1 dobropay.dlq.notifications-payment-events.v1 dobropay.dlq.receipts-payment-events.v1; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server ${KAFKA_BOOTSTRAP_SERVERS} --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
      done

  redis:
    image: redis:7.4.12-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"

  setup:
    build:
      context: .
      args:
        PROJECT: backend/Dobropay.Setup/Dobropay.Setup.csproj
    command: Dobropay.Setup.dll
    depends_on:
      auth-db:
        condition: service_healthy
      merchant-dev-db:
        condition: service_healthy
      payments-db:
        condition: service_healthy
      notifications-db:
        condition: service_healthy
      receipts-db:
        condition: service_healthy
    environment:
      AUTH_DB_CONNECTION_STRING: Host=auth-db;Database=${AUTH_DB_NAME};Username=${AUTH_DB_USER};Password=${AUTH_DB_PASSWORD}
      MERCHANT_DEV_DB_CONNECTION_STRING: Host=merchant-dev-db;Database=${MERCHANT_DEV_DB_NAME};Username=${MERCHANT_DEV_DB_USER};Password=${MERCHANT_DEV_DB_PASSWORD}
      PAYMENTS_DB_CONNECTION_STRING: Host=payments-db;Database=${PAYMENTS_DB_NAME};Username=${PAYMENTS_DB_USER};Password=${PAYMENTS_DB_PASSWORD}
      NOTIFICATIONS_DB_CONNECTION_STRING: Host=notifications-db;Database=${NOTIFICATIONS_DB_NAME};Username=${NOTIFICATIONS_DB_USER};Password=${NOTIFICATIONS_DB_PASSWORD}
      RECEIPTS_DB_CONNECTION_STRING: Host=receipts-db;Database=${RECEIPTS_DB_NAME};Username=${RECEIPTS_DB_USER};Password=${RECEIPTS_DB_PASSWORD}
      DEMO_STAFF_ID: ${DEMO_STAFF_ID}
      DEMO_STAFF_EMAIL: ${DEMO_STAFF_EMAIL}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD}
      DEMO_STAFF_SALT_SEED: ${DEMO_STAFF_SALT_SEED}
      DEMO_SHOP_A_ID: ${DEMO_SHOP_A_ID}
      DEMO_SHOP_A_NAME: ${DEMO_SHOP_A_NAME}
      DEMO_CREDENTIAL_A_ID: ${DEMO_CREDENTIAL_A_ID}
      DEMO_KEY_A: ${DEMO_KEY_A}
      DEMO_SUBSCRIPTION_A_ID: ${DEMO_SUBSCRIPTION_A_ID}
      DEMO_SHOP_B_ID: ${DEMO_SHOP_B_ID}
      DEMO_SHOP_B_NAME: ${DEMO_SHOP_B_NAME}
      DEMO_CREDENTIAL_B_ID: ${DEMO_CREDENTIAL_B_ID}
      DEMO_KEY_B: ${DEMO_KEY_B}
      DEMO_SUBSCRIPTION_B_ID: ${DEMO_SUBSCRIPTION_B_ID}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      DEMO_WEBHOOK_URL: ${DEMO_WEBHOOK_URL}

  auth:
    build:
      context: .
      args:
        PROJECT: backend/Dobropay.Auth/Dobropay.Auth.csproj
    command: Dobropay.Auth.dll
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Runtime: Host=auth-db;Database=${AUTH_DB_NAME};Username=${AUTH_DB_USER};Password=${AUTH_DB_PASSWORD}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}

  developer-api:
    build:
      context: .
      args:
        PROJECT: backend/Dobropay.DeveloperApi/Dobropay.DeveloperApi.csproj
    command: Dobropay.DeveloperApi.dll
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Runtime: Host=merchant-dev-db;Database=${MERCHANT_DEV_DB_NAME};Username=${MERCHANT_DEV_DB_USER};Password=${MERCHANT_DEV_DB_PASSWORD}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}

  payments:
    build:
      context: .
      args:
        PROJECT: backend/Dobropay.Payments/Dobropay.Payments.csproj
    command: Dobropay.Payments.dll
    depends_on:
      setup:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      developer-api:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Runtime: Host=payments-db;Database=${PAYMENTS_DB_NAME};Username=${PAYMENTS_DB_USER};Password=${PAYMENTS_DB_PASSWORD}
      Services__DeveloperApi: ${DEVELOPER_API_SERVICE_URL}
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      CHECKOUT_SECRET: ${CHECKOUT_SECRET}
      PROVIDER_SECRET: ${PROVIDER_SECRET}
      Sandbox__Enabled: ${SANDBOX_ENABLED}
      Sandbox__PublicBaseUrl: ${PUBLIC_BASE_URL}
      Sandbox__InternalBaseUrl: ${PAYMENTS_SERVICE_URL}
      Reconciliation__IntervalSeconds: ${RECONCILIATION_INTERVAL_SECONDS}
      Reconciliation__AttemptStaleSeconds: ${RECONCILIATION_ATTEMPT_STALE_SECONDS}
      Payments__ExpirationMinutes: ${PAYMENT_EXPIRATION_MINUTES}
      Payments__CaptureExpirationMinutes: ${PAYMENT_CAPTURE_EXPIRATION_MINUTES}

  notifications:
    build:
      context: .
      args:
        PROJECT: backend/Dobropay.Notifications/Dobropay.Notifications.csproj
    command: Dobropay.Notifications.dll
    depends_on:
      setup:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Runtime: Host=notifications-db;Database=${NOTIFICATIONS_DB_NAME};Username=${NOTIFICATIONS_DB_USER};Password=${NOTIFICATIONS_DB_PASSWORD}
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}
      Redis__Connection: ${REDIS_CONNECTION}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      Sandbox__Enabled: ${SANDBOX_ENABLED}

  email:
    build:
      context: .
      args:
        PROJECT: backend/Dobropay.Email/Dobropay.Email.csproj
    command: Dobropay.Email.dll
    depends_on:
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8080
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__From: ${SMTP_FROM}

  receipts:
    build:
      context: .
      args:
        PROJECT: backend/Dobropay.Receipts/Dobropay.Receipts.csproj
    command: Dobropay.Receipts.dll
    depends_on:
      setup:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      email:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Runtime: Host=receipts-db;Database=${RECEIPTS_DB_NAME};Username=${RECEIPTS_DB_USER};Password=${RECEIPTS_DB_PASSWORD}
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}
      Services__Email: ${EMAIL_SERVICE_URL}
      Demo__ReceiptEmail: ${DEMO_RECEIPT_EMAIL}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}

  merchant-admin:
    build:
      context: .
      args:
        PROJECT: backend/Dobropay.MerchantAdmin/Dobropay.MerchantAdmin.csproj
    command: Dobropay.MerchantAdmin.dll
    depends_on:
      auth:
        condition: service_started
      developer-api:
        condition: service_started
      payments:
        condition: service_started
      notifications:
        condition: service_started
      receipts:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8080
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      Services__Auth: ${AUTH_SERVICE_URL}
      Services__DeveloperApi: ${DEVELOPER_API_SERVICE_URL}
      Services__Payments: ${PAYMENTS_SERVICE_URL}
      Services__Notifications: ${NOTIFICATIONS_SERVICE_URL}
      Services__Receipts: ${RECEIPTS_SERVICE_URL}

  gateway:
    image: caddy:2.10.2-alpine
    depends_on:
      auth:
        condition: service_started
      payments:
        condition: service_started
      merchant-admin:
        condition: service_started
      notifications:
        condition: service_started
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  auth_db_data:
  merchant_dev_db_data:
  payments_db_data:
  notifications_db_data:
  receipts_db_data:
  kafka_data:
